[build]
  publish = "site"

[[redirects]]
  from = "/probleme"
  to = "/probleme.html"
  status = 200

[[redirects]]
  from = "/solution"
  to = "/solution.html"
  status = 200

[[redirects]]
  from = "/testeurs"
  to = "/testeurs.html"
  status = 200

[[redirects]]
  from = "/demonstration"
  to = "/demonstration.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
